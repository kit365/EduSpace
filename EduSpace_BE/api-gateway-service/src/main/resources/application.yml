server:
  port: ${GATEWAY_PORT:8080}

# Upstream: profile "dev" (mặc định) dùng http://localhost — không cần Eureka. Prod/Docker: SPRING_PROFILES_ACTIVE rỗng hoặc set GATEWAY_*_URI=lb://…
eduspace:
  gateway:
    account-service-uri: ${GATEWAY_ACCOUNT_SERVICE_URI:lb://ACCOUNT-SERVICE}
    booking-service-uri: ${GATEWAY_BOOKING_SERVICE_URI:lb://BOOKING-SERVICE}
    conversation-service-uri: ${GATEWAY_CONVERSATION_SERVICE_URI:lb://CONVERSATION-SERVICE}
    room-service-uri: ${GATEWAY_ROOM_SERVICE_URI:lb://ROOM-SERVICE}

spring:
  application:
    name: api-gateway
  # Mặc định dev: forward thẳng tới localhost (application-dev.yml), tránh 503 khi không chạy Eureka.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  cloud:
    gateway:
      # Route definitions
      routes:
        # Account Service routes
        - id: account-service
          uri: ${eduspace.gateway.account-service-uri}
          predicates:
            # Forward account, auth, points & rewards endpoints to ACCOUNT-SERVICE
            - Path=/api/v1/accounts/**, /api/v1/auth/**, /api/v1/points/**, /api/v1/rewards/**, /api/v1/banks/**, /api/v1/bank-information/**

        # Account Service Swagger Docs
        - id: account-service-docs
          uri: ${eduspace.gateway.account-service-uri}
          predicates:
            - Path=/v3/api-docs/account-service
          filters:
            - RewritePath=/v3/api-docs/account-service, /v3/api-docs

        # Booking Service routes
        - id: booking-service
          uri: ${eduspace.gateway.booking-service-uri}
          predicates:
            - Path=/api/v1/bookings/**,/api/v1/admin/booking-deposit-refund-policies/**,/api/v1/voucher-campaigns/**,/api/v1/vouchers/**,/api/v1/user-vouchers/**

        # Booking Service Swagger Docs
        - id: booking-service-docs
          uri: ${eduspace.gateway.booking-service-uri}
          predicates:
            - Path=/v3/api-docs/booking-service
          filters:
            - RewritePath=/v3/api-docs/booking-service, /v3/api-docs

        # Conversation Service routes (REST)
        - id: conversation-service
          uri: ${eduspace.gateway.conversation-service-uri}
          predicates:
            - Path=/api/v1/conversations/**, /api/v1/messages/**, /api/v1/azure-communication/**

        # Conversation Service routes (WebSocket + media)
        - id: conversation-service-ws
          uri: ${eduspace.gateway.conversation-service-uri}
          predicates:
            - Path=/ws/**, /media/**

        # Conversation Service Swagger Docs
        - id: conversation-service-docs
          uri: ${eduspace.gateway.conversation-service-uri}
          predicates:
            - Path=/v3/api-docs/conversation-service
          filters:
            - RewritePath=/v3/api-docs/conversation-service, /v3/api-docs

        # Room Service routes
        - id: room-service
          uri: ${eduspace.gateway.room-service-uri}
          predicates:
            - Path=/api/v1/rooms,/api/v1/rooms/**,/api/v1/properties,/api/v1/properties/**,/api/v1/extra-services,/api/v1/extra-services/**,/api/v1/amenities,/api/v1/amenities/**,/api/v1/room-amenities,/api/v1/room-amenities/**,/api/v1/reviews,/api/v1/reviews/**,/api/v1/system-calendar-rules,/api/v1/system-calendar-rules/**,/api/v1/room-blocks,/api/v1/room-blocks/**,/api/v1/room-categories,/api/v1/room-categories/**,/api/v1/public/**

        # Room Service Swagger Docs
        - id: room-service-docs
          uri: ${eduspace.gateway.room-service-uri}
          predicates:
            - Path=/v3/api-docs/room-service
          filters:
            - RewritePath=/v3/api-docs/room-service, /v3/api-docs

      # Global CORS configuration
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: false

      # Default filters applied to all routes
      default-filters:
        # Tránh lỗi Double CORS khi cả Gateway và Service con đều set header
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:${KEYCLOAK_PORT:8180}/realms/eduspace}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:${KEYCLOAK_PORT:8180}/realms/eduspace/protocol/openid-connect/certs}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:${DISCOVERY_SERVER_PORT:8761}/eureka/}
  instance:
    prefer-ip-address: true

# SpringDoc Aggregation (Hiển thị tài liệu từ nhiều service)
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: Account Service
        url: /v3/api-docs/account-service
      - name: Booking Service
        url: /v3/api-docs/booking-service
      - name: Conversation Service
        url: /v3/api-docs/conversation-service
      - name: Room Service
        url: /v3/api-docs/room-service

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: always
