server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: api-gateway

  # Mặc định dev: route thẳng tới localhost (không cần Eureka). Docker: SPRING_PROFILES_ACTIVE=prod.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  cloud:
    gateway:
      # Route definitions nằm trong application-dev.yml (static) hoặc application-prod.yml (lb:// + Eureka).
      # Global CORS configuration
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: false

      # Default filters applied to all routes
      default-filters:
        # Tránh lỗi Double CORS khi cả Gateway và Service con đều set header
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:${KEYCLOAK_PORT:8180}/realms/eduspace}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:${KEYCLOAK_PORT:8180}/realms/eduspace/protocol/openid-connect/certs}

# Eureka: chỉ bật trong profile prod (application-prod.yml).

# SpringDoc Aggregation (Hiển thị tài liệu từ nhiều service)
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: Account Service
        url: /v3/api-docs/account-service
      - name: Booking Service
        url: /v3/api-docs/booking-service
      - name: Conversation Service
        url: /v3/api-docs/conversation-service
      - name: Room Service
        url: /v3/api-docs/room-service

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: always
