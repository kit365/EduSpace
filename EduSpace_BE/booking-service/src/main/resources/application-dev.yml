server:
  port: ${BOOKING_SERVICE_PORT:8082}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_BOOKING_HOST_PORT:5433}/eduspace_booking}
    username: ${SPRING_DATASOURCE_USERNAME:eduspace}
    password: ${SPRING_DATASOURCE_PASSWORD:eduspace_dev_123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
