server:
  port: ${BOOKING_SERVICE_PORT:8082}

spring:
  application:
    name: booking-service
  profiles:
    active: dev
  datasource:
    # Luôn có URL mặc định kể cả khi IDE không bật profile `dev` (tránh lỗi "Failed to determine a suitable driver class").
    # 127.0.0.1: khớp docker-compose POSTGRES_BOOKING_HOST_PORT (thường 15433 trong .env).
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:${POSTGRES_BOOKING_HOST_PORT:5433}/eduspace_booking}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:eduspace}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:eduspace_dev_123}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        "[format_sql]": true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:${KEYCLOAK_PORT:8180}/realms/eduspace}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:${KEYCLOAK_PORT:8180}/realms/eduspace/protocol/openid-connect/certs}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:${DISCOVERY_SERVER_PORT:8761}/eureka/}
  instance:
    prefer-ip-address: true

springdoc:
  swagger-ui:
    persist-authorization: true

integration:
  room-service:
    base-url: ${ROOM_SERVICE_BASE_URL:lb://ROOM-SERVICE}
  account-service:
    base-url: ${ACCOUNT_SERVICE_BASE_URL:lb://ACCOUNT-SERVICE}
    internal-api-key: ${INTERNAL_ACCOUNT_API_KEY:dev-internal-key-change-me}

services:
  room-service:
    base-url: ${ROOM_SERVICE_BASE_URL:lb://ROOM-SERVICE}

