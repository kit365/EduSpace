spring:
  application:
    name: conversation-service
  profiles:
    active: dev

  security:
    oauth2:
      resourceserver:
        jwt:
          # Must match account-service and the iss claim in access tokens (same KEYCLOAK_ISSUER_URI in all services).
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:${KEYCLOAK_PORT:8180}/realms/eduspace}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:${KEYCLOAK_PORT:8180}/realms/eduspace/protocol/openid-connect/certs}

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: ${KAFKA_CONSUMER_GROUP:conversation-service}
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.eduspace.*"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:${DISCOVERY_SERVER_PORT:8761}/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    persist-authorization: true

app:
  chat:
    # One-time: true → on startup, resolve email in user1_id/user2_id/sender_id to Keycloak id via account-service, then set false.
    backfill-email-participants-on-startup: false
  media:
    storage-path: ${MEDIA_STORAGE_PATH:./data/media}
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:http://localhost:${GATEWAY_PORT:8080}}
  outbox:
    publisher-delay-ms: ${OUTBOX_PUBLISHER_DELAY_MS:2000}
  kafka:
    topics:
      conversation-events: ${KAFKA_TOPIC_CONVERSATION_EVENTS:eduspace.conversation.events}
      assign-staff-request: ${KAFKA_TOPIC_ASSIGN_STAFF_REQUEST:eduspace.assign-staff.request}
      assign-staff-result: ${KAFKA_TOPIC_ASSIGN_STAFF_RESULT:eduspace.assign-staff.result}
  support:
    admin-keycloak-id: ${SUPPORT_ADMIN_KEYCLOAK_ID:admin-keycloak-id-0000}
