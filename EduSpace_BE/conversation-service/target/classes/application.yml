spring:
  application:
    name: conversation-service
  profiles:
    active: dev

  datasource:
    # Local PostgreSQL (default port 5432). Override via SPRING_DATASOURCE_* or POSTGRES_* env.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/eduspace_conversation}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/eduspace}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/eduspace/protocol/openid-connect/certs}

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: ${KAFKA_CONSUMER_GROUP:conversation-service}
      auto-offset-reset: earliest

server:
  port: ${SERVER_PORT:8083}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    persist-authorization: true

app:
  media:
    storage-path: ${MEDIA_STORAGE_PATH:./data/media}
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:http://localhost:8080}
  outbox:
    publisher-delay-ms: ${OUTBOX_PUBLISHER_DELAY_MS:2000}
  kafka:
    topics:
      conversation-events: ${KAFKA_TOPIC_CONVERSATION_EVENTS:eduspace.conversation.events}
  support:
    admin-keycloak-id: ${SUPPORT_ADMIN_KEYCLOAK_ID:admin-keycloak-id-0000}

