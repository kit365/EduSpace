# Local DB — PostgreSQL on this machine (localhost:5432).
# Create DB: psql -U postgres -c "CREATE DATABASE eduspace_conversation;"
# Override with SPRING_DATASOURCE_* or POSTGRES_* env if needed.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/eduspace_conversation}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:Linhvovip}}
