server:
  port: ${BOOKING_SERVICE_PORT:8082}

spring:
  application:
    name: booking-service
  profiles:
    active: dev
  jpa:
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:${KEYCLOAK_PORT:8180}/realms/eduspace}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:${KEYCLOAK_PORT:8180}/realms/eduspace/protocol/openid-connect/certs}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:${DISCOVERY_SERVER_PORT:8761}/eureka/}
  instance:
    prefer-ip-address: true

springdoc:
  swagger-ui:
    persist-authorization: true

integration:
  room-service:
    base-url: ${ROOM_SERVICE_BASE_URL:http://localhost:8083}

services:
  room-service:
    base-url: ${ROOM_SERVICE_BASE_URL:http://localhost:8084}
