# Disable Admin Initializer in tests to avoid Keycloak connection errors
app.init-admin=false

# Keycloak dummy configuration for tests
keycloak.server-url=http://localhost:8080/auth
keycloak.realm=eduspace
keycloak.client-id=account-service
keycloak.client-secret=dummy-secret

# H2 Database configuration for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate/JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis
spring.data.redis.repositories.enabled=false

# Eureka
eureka.client.enabled=false
