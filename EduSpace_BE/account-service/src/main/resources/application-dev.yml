server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/eduspace_account
    username: eduspace
    password: eduspace_dev_123
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # OAuth2 Resource Server (Keycloak)
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/eduspace
          jwk-set-uri: http://localhost:8180/realms/eduspace/protocol/openid-connect/certs

# Keycloak Admin Client
keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8180}
  realm: ${KEYCLOAK_REALM:eduspace}
  client-id: ${KEYCLOAK_CLIENT_ID:eduspace-be}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:eduspace-secret}



