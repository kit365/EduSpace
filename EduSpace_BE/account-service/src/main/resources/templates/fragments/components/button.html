<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

    <a th:fragment="button(href, text)" th:href="${href}"
        style="display: inline-block; background-color: #4F46E5; color: #ffffff; text-decoration: none; padding: 14px 32px; border-radius: 8px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 16px; font-weight: 600; letter-spacing: 0.3px;"
        th:text="${text}">
        Button
    </a>

</body>

</html>
