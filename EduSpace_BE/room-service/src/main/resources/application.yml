server:
  port: ${ROOM_SERVICE_PORT:8083}

spring:
  application:
    name: room-service
  profiles:
    active: dev
  messages:
    basename: i18n/messages
  jpa:
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:${DISCOVERY_SERVER_PORT:8761}/eureka/}
  instance:
    prefer-ip-address: true

springdoc:
  swagger-ui:
    persist-authorization: true

