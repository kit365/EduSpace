server:
  port: 8083

# Cần discovery-server (8761) + đăng ký Eureka để FE qua gateway :8080 gọi được room-service.
spring:
  datasource:
    # 127.0.0.1 tránh một số máy Windows resolve localhost → IPv6 (::1) trong khi Docker Desktop chỉ publish IPv4.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5434/eduspace_room}
    username: ${SPRING_DATASOURCE_USERNAME:eduspace}
    password: ${SPRING_DATASOURCE_PASSWORD:eduspace_dev_123}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Phải là 1: baseline-version = 9 khiến baseline() bỏ qua V1–V9 → schema thiếu bảng nhưng history báo đã 9.
    baseline-version: 1
    validate-on-migrate: false
    repair-on-migrate: true

