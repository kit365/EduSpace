server:
  port: ${ROOM_SERVICE_PORT:8083}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_ROOM_HOST_PORT:5434}/eduspace_room}
    username: ${SPRING_DATASOURCE_USERNAME:eduspace}
    password: ${SPRING_DATASOURCE_PASSWORD:eduspace_dev_123}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Khi DB đã có bảng (từ lần migrate trước) nhưng flyway_schema_history bị xóa/trống,
    # Flyway baseline ở 9 → bỏ qua V1–V4 (schema đã có), rồi chạy V10 (sửa property_id).
    # DB trống hoàn toàn: không baseline, Flyway chạy V1 → … → V10 như bình thường.
    baseline-version: 9
    # Dev: tránh fail khi đổi nội dung file migration cùng version (checksum khác DB).
    # Prod: giữ validate (mặc định) — không set ở application-prod.yml.
    validate-on-migrate: false
    repair-on-migrate: true

